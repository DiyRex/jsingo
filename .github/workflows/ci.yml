name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  # The committed JS artifacts are build output. CI regenerates them and fails
  # on any difference, so the embedded host and the module bundles cannot drift
  # from their TypeScript sources without someone noticing.
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable, cache: true }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: make host-check
      - run: go run ./cmd/jsingo build -C . -check
      - run: go run ./cmd/jsingo doctor -C . -strict

  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable, cache: true }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      # -count=2 is deliberate. Several real defects here only appeared on a
      # second run: goroutines logging after their test completed, and a
      # per-test bundler invocation that deadlocked under contention.
      - run: go test -race -count=2 -tags=integration -timeout=15m ./...

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: cd jsruntime && bun install --frozen-lockfile --ignore-scripts
      - run: cd jsruntime && bunx tsc --noEmit
      - run: cd jsruntime && bun test

  fuzz:
    # Short smoke fuzz on every PR; the corpus guards the untrusted-input boundary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - run: go test ./internal/wire -run='^$' -fuzz=FuzzDecodeFrame -fuzztime=60s
      - run: go test ./internal/wire -run='^$' -fuzz=FuzzDecodeCall -fuzztime=60s
